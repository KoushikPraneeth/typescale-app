name: AKS ARM64 image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan-publish:
    name: Build, test, scan, and publish TypeScale v1.0.0 for ARM64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Check out the immutable v1.0.0 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v1.0.0
          fetch-depth: 0

      - name: Verify ARM64 runner and source release
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64|arm64) ;;
            *) echo "Expected an ARM64 runner, got $(uname -m)" >&2; exit 1 ;;
          esac
          test "$(git describe --tags --exact-match HEAD)" = "v1.0.0"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "056cb02da9a856793f29796526f5916207d59a04"
          IMAGE_TAG="aks-arm64-${SOURCE_SHA}-run-${GITHUB_RUN_ID}"
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf 'image_tag=%s\n' "$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          printf 'Source commit: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Docker architecture: %s\n' "$(docker info --format '{{.Architecture}}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run application tests
        run: |
          python -m pytest -q
          node --check frontend/app.js

      - name: Build ARM64 container
        env:
          IMAGE_TAG: ghcr.io/koushikpraneeth/typescale:${{ steps.metadata.outputs.image_tag }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        run: |
          docker build --platform linux/arm64 \
            --build-arg VCS_REF="$SOURCE_SHA" \
            --build-arg IMAGE_VERSION="1.0.0-arm64-$SOURCE_SHA" \
            --tag "$IMAGE_TAG" \
            .

      - name: Scan ARM64 image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/koushikpraneeth/typescale:aks-arm64-${{ steps.metadata.outputs.source_sha }}-run-${{ github.run_id }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Publish immutable ARM64 image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ghcr.io/koushikpraneeth/typescale:${{ steps.metadata.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USER" \
            --password-stdin
          docker push "$IMAGE_TAG"
          IMAGE_DIGEST="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE_TAG")"
          test -n "$IMAGE_DIGEST"
          printf 'Published image: %s@%s\n' "${IMAGE_TAG%%:*}" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Architecture: linux/arm64\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Registry tag: %s\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE_TAG"
