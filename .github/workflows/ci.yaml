name: TypeScale CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Application Tests
    runs-on: ubuntu-24.04

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  container:
    name: Container Build and Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REF: ghcr.io/koushikpraneeth/typescale:${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VCS_REF="${{ github.sha }}" \
            --build-arg IMAGE_VERSION="${{ github.sha }}" \
            --tag typescale:ci \
            --tag "$IMAGE_REF" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: typescale:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library

      - name: Publish immutable image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          docker push "$IMAGE_REF"
          docker logout ghcr.io

  helm:
    name: Helm Chart Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Lint chart
        run: >-
          helm lint --strict deploy/helm/typescale
          -f deploy/helm/typescale/values-orbstack.yaml

      - name: Render, validate, and package chart
        run: |
          helm template typescale deploy/helm/typescale \
            --namespace typescale-ci \
            > /tmp/typescale-default.yaml
          helm template typescale deploy/helm/typescale \
            --namespace typescale-ci \
            -f deploy/helm/typescale/values-orbstack.yaml \
            > /tmp/typescale-orbstack.yaml
          helm template aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            deploy/helm/typescale \
            --namespace typescale-ci \
            -f deploy/helm/typescale/values-orbstack.yaml \
            > /tmp/typescale-long-name.yaml

          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 -c 'import yaml; docs=[d for d in yaml.safe_load_all(open("/tmp/typescale-long-name.yaml")) if d]; keys=[(d["apiVersion"], d["kind"], d["metadata"].get("namespace", ""), d["metadata"]["name"]) for d in docs]; assert len(keys) == len(set(keys)); assert all(len(key[3]) <= 63 for key in keys)'

          for manifest in /tmp/typescale-default.yaml /tmp/typescale-orbstack.yaml /tmp/typescale-long-name.yaml; do
            docker run --rm -i \
              ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
              -strict -summary -kubernetes-version 1.31.0 - < "$manifest"
          done

          helm package deploy/helm/typescale --destination /tmp