{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "typescale.defaultDenyFullname" . }}
  labels:
    {{- include "typescale.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "typescale.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "typescale.allowHttpFullname" . }}
  labels:
    {{- include "typescale.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "typescale.appSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
{{- if .Values.app.metrics.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "typescale.allowMetricsFullname" . }}
  labels:
    {{- include "typescale.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "typescale.appSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.app.metrics.allowedNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.app.metrics.port }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "typescale.allowRedisFullname" . }}
  labels:
    {{- include "typescale.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "typescale.redisSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "typescale.appSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port }}
{{- end }}
